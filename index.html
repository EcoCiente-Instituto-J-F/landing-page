<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoCiente</title>
    <link rel="icon" href="assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <header class="header">
        <div class="navbar">
            <div class="logotipo-navbar">
                <img src="assets/logotipo.png" alt="Logo do EcoCiente">
            </div>
            <ul class="links-navbar" style="list-style: none;">
                <li><a href="#funcionalidades">Funcionalidades</a></li>
                <li><a href="#beneficios">Benefícios</a></li>
                <li><a href="#planos">Planos</a></li>
                <li><a href="#nossaMissao">Nossa Missão</a></li>
                <li><a href="#duvidas">Dúvidas</a></li>
            </ul>
        </div>
    </header>

    <section class="hero">
        <div class="container-hero">
            <div class="conteudo-hero">
                <div class="logotipo-hero">
                    <img src="assets/logo-branco.png">
                </div>
                <h1 class="titulo-rosa" style="color: #FE2469;">
                    Conectamos condomínios e cooperativas
                    <span class="titulo-verde" style="color: #0EB488;">de reciclagem <br>em uma única plataforma</span>
                </h1>
                <p class="descricao-hero">
                    Facilitamos a coleta seletiva, aumentamos a<br> reciclagem e fortalecemos a economia<br> circular através de uma conexão simples,<br> eficiente e sustentável.
                </p>
            </div>
            <div class="mockups-hero">
                <img src="assets/celularesHero.png">
            </div>
        </div>
    </section>
</body>
</html>
